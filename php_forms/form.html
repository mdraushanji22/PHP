<!doctype html>
<html lang="en">
  <head>
    <title>Form Handling with PHP</title>
  </head>
  <body>
    <form action="./form.php" method="post">
      <input type="text" name="name" placeholder="Enter User Name" />
      <br />
      <br />
      <input type="text" name="email" placeholder="Enter your email" />
      <br />
      <br />
      <input
        type="password"
        name="password"
        placeholder="Enter your password"
      />
      <br />
      <br />
      <input type="checkbox" name="skills[]" value="php" /><span>PHP</span>
      <br />
      <input type="checkbox" name="skills[]" value="java" /><span>JAVA</span>
      <br />
      <input type="checkbox" name="skills[]" value="cpp" /><span>CPP</span>
      <br />
      <input type="checkbox" name="skills[]" value="javascript" /><span
        >JAVASCRIPT</span
      >
      <br />
      <br />
      <input type="radio" name="gender" value="male" /><span>Male</span>
      <input type="radio" name="gender" value="female" /><span>Female</span>

      <br />
      <br />
      <select name="city">
        <option value="select your city">Select your city</option>
        <option value="delhi">Delhi</option>
        <option value="gurgaon">Gurgaon</option>
        <option value="noida">Noida</option>
      </select>
      <br />
      <br />
      <textarea name="bio"></textarea>
      <br />
      <br />
      <button>Sign Up</button>
    </form>
  </body>
</html>
